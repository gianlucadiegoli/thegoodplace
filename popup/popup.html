<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #333;
    }
    .header {
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: white;
      padding: 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .header p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .content {
      padding: 16px;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }
    .not-found {
      text-align: center;
      padding: 20px;
      color: #999;
    }
    .not-found .domain {
      font-weight: 600;
      color: #666;
    }
    .brand-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .brand-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 700;
    }
    .overall-score {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }
    .overall-score .num {
      font-size: 20px;
      line-height: 1;
    }
    .overall-score .den {
      font-size: 10px;
      opacity: 0.8;
    }
    .score-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .score-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .score-row .name {
      font-size: 12px;
      width: 100px;
      color: #666;
    }
    .score-row .bar-bg {
      flex: 1;
      height: 8px;
      background: #e8e8e8;
      border-radius: 4px;
      overflow: hidden;
    }
    .score-row .bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }
    .score-row .val {
      font-size: 12px;
      font-weight: 600;
      width: 18px;
      text-align: right;
    }
    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #555;
      line-height: 1.5;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .fonti {
      margin-top: 8px;
      font-size: 10px;
      color: #999;
    }
    .footer {
      text-align: center;
      padding: 12px;
      font-size: 10px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>The Good Place</h1>
    <p>Valutazione di Finanza Etica</p>
  </div>
  <div class="content" id="content">
    <div class="loading">Analisi in corso...</div>
  </div>
  <div class="footer">v1.0 &mdash; Dati a scopo informativo</div>
  <script src="popup.js"></script>
</body>
</html>
